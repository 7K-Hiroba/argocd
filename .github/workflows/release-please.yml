name: release-please
on: {push: {branches: [main]}}
permissions: {contents: read}
jobs:
  propose:
    uses: 7K-Hiroba/workflows/.github/workflows/release-please.yml@90146feb7f553ff51fa4d511c65f5602eaaaf0d4 # v2.0.0-candidate.90146fe (unreleased); merged workflows PRs #39/#40/#41
    with: {root: ., app-id: "${{ vars.HIROBA_RELEASE_APP_ID }}"}
    secrets:
      release-private-key: "${{ secrets.HIROBA_RELEASE_PRIVATE_KEY }}"
    permissions: {contents: write, pull-requests: write}
