apiVersion: inari.dev/v1alpha1
kind: Observability
app: argocd
folder: argocd
datasources:
  prometheus: ${DS_PROMETHEUS}
linkVariables: [namespace]
dashboards:
  - title: Argo CD overview
    uid: argocd-overview
    file: dashboards/overview.json
rules:
  - file: rules/app.yaml
    evaluation: central
  - file: rules/client.yaml
    evaluation: local
targets: [central, local]
severityRouting:
  critical: platform-security
minimumAppVersion: ">=0.1.0 <2.0.0"
observabilityPack:
  package: observability-pack
  versionRange: ">=0.1.0 <2.0.0"
