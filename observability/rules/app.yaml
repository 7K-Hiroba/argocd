groups:
  - name: argocd
    interval: 1m
    rules:
      - record: workflows_scaffold:up:sum
        expr: sum(workflows_scaffold_up)
      - alert: WorkflowsScaffoldDown
        expr: workflows_scaffold_up == 0
        for: 5m
        labels:
          severity: critical
          app: argocd
        annotations:
          summary: Synthetic argocd target is down
