argo-cd:
  server:
    replicas: 2
    ingress:
      enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  repoServer:
    replicas: 2
  controller:
    replicas: 1
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  applicationSet:
    replicas: 2
  redis-ha:
    enabled: true
  configs:
    cm:
      statusBadgeEnabled: true
    rbac:
      policy.default: role:readonly
  dex:
    enabled: false
  notifications:
    enabled: false
observability:
  # Inari-managed deployments provision the selected companion instead.
  enabled: false
  rules:
    enabled: false
